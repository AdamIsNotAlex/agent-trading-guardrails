worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format egress escape=json '{"time":"$time_iso8601","client":"$remote_addr",'
        '"method":"$request_method","host":"$host","path":"$uri",'
        '"status":$status,"upstream":"$upstream_addr","seconds":$request_time}';
    access_log /var/log/nginx/access.log egress;
    resolver 127.0.0.1 valid=30s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ignore_headers X-Accel-Redirect;

    # Not a forward/CONNECT proxy: Agent can submit intents and check health only.
    server {
        listen 172.30.10.20:8080 default_server;
        server_name _;
        location = /health {
            limit_except GET { deny all; }
            proxy_pass http://172.30.20.20:3000/health;
        }
        location = /evaluate {
            limit_except POST { deny all; }
            proxy_pass http://172.30.20.20:3000/evaluate;
        }
        location / { return 403; }
    }

    # Reviewer credentials stay in Guardrail. Agent cannot reach this listener.
    server {
        listen 172.30.20.10:8081 default_server;
        server_name _;
        location = /v1/chat/completions {
            limit_except POST { deny all; }
            set $provider api.openai.com;
            proxy_set_header Host api.openai.com;
            proxy_ssl_server_name on;
            proxy_ssl_name api.openai.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_pass https://$provider/v1/chat/completions;
        }
        location / { return 403; }
    }
}
