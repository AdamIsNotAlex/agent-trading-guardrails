# Egress resolver: 127.0.0.1:53; upstream DNS only for exact reviewer API hosts.
#
# Suffix matching (dnsmasq man):
#   server=/api.openai.com/1.1.1.1  matches api.openai.com AND children.
#   address=/*.api.openai.com/      matches children only, not the apex.
#   host-record is exact-label. local=/guardrail/ matches the label + children.
# Without a default --server, CNAME chase into another zone is NXDOMAIN;
# A/AAAA in the same answer section still work. Do not add search/domain
# in the mounted resolv.conf (libc suffix rewriting).
# --stop-dns-rebind rejects RFC1918/link-local in upstream answers; nft
# nonglobal4 still drops 443 to those addresses if a public IP is later used.
user=root
group=root
keep-in-foreground
bind-interfaces
listen-address=127.0.0.1
port=53
no-resolv
no-hosts
bogus-priv
domain-needed
filter-AAAA
stop-dns-rebind
cache-size=200
local-ttl=0
max-ttl=60
log-queries=extra
pid-file=/run/dnsmasq.pid

host-record=guardrail,172.30.20.20
local=/guardrail/

# Exact apex via 1.1.1.1; every subdomain of it is NXDOMAIN (more specific).
server=/api.openai.com/1.1.1.1
address=/*.api.openai.com/
server=/api.typesafe.ai/1.1.1.1
address=/*.api.typesafe.ai/
server=/api.cloudflare.com/1.1.1.1
address=/*.api.cloudflare.com/
# Everything else: NXDOMAIN, never forwarded. No default --server=1.1.1.1.
address=/#/
