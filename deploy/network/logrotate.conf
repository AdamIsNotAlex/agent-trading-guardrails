/var/log/guardrails/network/dns.log {
    size 10M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 root root
}

/var/log/guardrails/network/blocked-egress.log {
    size 10M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 root root
}
