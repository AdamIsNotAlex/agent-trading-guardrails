[global]
logfile="/run/ulogd-daemon.log"
loglevel=5
plugin="@PLUGINDIR@/ulogd_inppkt_NFLOG.so"
plugin="@PLUGINDIR@/ulogd_filter_IFINDEX.so"
plugin="@PLUGINDIR@/ulogd_filter_IP2STR.so"
plugin="@PLUGINDIR@/ulogd_filter_PRINTPKT.so"
plugin="@PLUGINDIR@/ulogd_output_LOGEMU.so"
plugin="@PLUGINDIR@/ulogd_raw2packet_BASE.so"

stack=log2:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,emu1:LOGEMU

[log2]
group=1
bind=1
netlink_qthreshold=1
netlink_qtimeout=10
numeric_label=0

[emu1]
file="/var/log/guardrails/network/blocked-egress.log"
sync=1
