# Agent resolver: 127.0.0.1:53 only, no upstream, no suffix tunnels.
#
# Suffix matching: address=/name/ and local=/name/ match name AND every
# descendant (subdomain.name). host-record is exact-label only, so
# egress-proxy -> 172.30.10.20 while subdomain.egress-proxy is NXDOMAIN.
# Do not use address=/egress-proxy/<ip>: that would answer children too.
# Parent must mount this resolv.conf with no search/domain (libc suffix rewrite).
# bind-interfaces + listen-address: 127.0.0.1:53 only. nft INPUT drops net-facing :53.
user=root
group=root
keep-in-foreground
bind-interfaces
listen-address=127.0.0.1
port=53
no-resolv
no-hosts
bogus-priv
domain-needed
filter-AAAA
cache-size=0
local-ttl=0
log-queries=extra
pid-file=/run/dnsmasq.pid

host-record=egress-proxy,172.30.10.20
# Catch-all NXDOMAIN, never forwarded. Covers subdomain.egress-proxy and
# every other name. More-specific host-record above still answers the apex.
address=/#/
